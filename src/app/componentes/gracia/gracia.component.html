<div class="container mt-4">
  <form [formGroup]="facturaForm">
    <div class="row align-items-center">
      <div class="col-md-4">
        <label for="cantidadVersiculos" class="form-label font-weight-bold">
          Cantidad de versículos (máx. 5):
        </label>
        <input 
          type="number" 
          id="cantidadVersiculos" 
          formControlName="cantidadVersiculos" 
          class="form-control" 
          min="1" 
          max="5" />
      </div>

      <div class="col-md-4 mt-4">
        <button 
          type="button" 
          class="btn btn-primary" 
          [disabled]="facturaForm.get('cantidadVersiculos')?.invalid"
          (click)="imprimir()">
          <i class="fas fa-print"></i> Imprimir Tirilla
        </button>
      </div>
    </div>
  </form>
</div>
